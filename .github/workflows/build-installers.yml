name: Build ARIA installers

# Builds downloadable installers for Windows (.exe), macOS (.dmg/.zip), and
# Linux (.AppImage/.deb) on their native runners.
#
# Run it two ways:
#   • Manually: Actions tab → "Build ARIA installers" → Run workflow
#     → installers appear as downloadable artifacts on the run page.
#   • Tag a release: git tag v0.1.0 && git push origin v0.1.0
#     → installers are attached to a GitHub Release for public download.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: assistant

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # No code-signing certificates: ship unsigned builds rather than fail.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assistant/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build installers
        run: npx electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: aria-${{ runner.os }}
          path: |
            assistant/dist/*.exe
            assistant/dist/*.dmg
            assistant/dist/*.zip
            assistant/dist/*.AppImage
            assistant/dist/*.deb
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
