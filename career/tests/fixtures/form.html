<!doctype html><html><body><h1>Apply: Tax Associate</h1>
<form method="post" action="/submit" enctype="multipart/form-data">
<label for="fn">First Name</label><input id="fn" name="first" required>
<label for="ln">Last Name</label><input id="ln" name="last" required>
<label for="em">Email</label><input id="em" name="email" type="email" required>
<label for="ph">Phone</label><input id="ph" name="phone" type="tel">
<label for="li">LinkedIn Profile</label><input id="li" name="linkedin">
<label for="sc">School</label><input id="sc" name="school">
<label for="gp">Cumulative GPA</label><input id="gp" name="gpa">
<label for="rs">Resume/CV</label><input id="rs" name="resume" type="file" required>
<label for="cl">Cover Letter</label><input id="cl" name="cover" type="file">
<label for="hw">How did you hear about us?</label><input id="hw" name="heard">
__EXTRA__
<button type="submit">Submit Application</button></form></body></html>
