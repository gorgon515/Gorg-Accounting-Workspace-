name: Build ARIA installers

# Builds downloadable installers for Windows (.exe), macOS (.dmg/.zip), and
# Linux (.AppImage/.deb) on their native runners.
#
# Run it two ways — both end in a GitHub Release with the installers attached
# (manual runs release under v<package.json version>; they also appear as
# downloadable artifacts on the run page):
#   • Manually: Actions tab → "Build ARIA installers" → Run workflow
#   • Tag a release: git tag v0.1.0 && git push origin v0.1.0

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: assistant

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # No code-signing certificates: ship unsigned builds rather than fail.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: assistant/package-lock.json

      - name: Install dependencies
        run: npm install

      # Pre-download the voice + brain model weights into models/, which the
      # build bundles as resources — so the installed app is fully offline
      # from first launch (no internet needed, ever, for voice or brain).
      - name: Bundle local AI models (offline-first)
        run: npm run model
        env:
          MODELS_DIR: models

      # On macOS, build the two arches in separate, sequential invocations.
      # A single run builds the arm64 and x64 DMGs concurrently and they race
      # on electron-builder's shared cache lock ("Lock file is already being
      # held"); serializing the arches avoids that contention deterministically.
      - name: Build installers
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npx electron-builder --mac --arm64 --publish never
            npx electron-builder --mac --x64 --publish never
          else
            npx electron-builder --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: aria-${{ runner.os }}
          path: |
            assistant/dist/*.exe
            assistant/dist/*.dmg
            assistant/dist/*.zip
            assistant/dist/*.AppImage
            assistant/dist/*.deb
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Tag-triggered runs release under that tag; manual runs release under
      # v<package.json version> (created at this commit if it doesn't exist,
      # assets refreshed if it does) — so no run ever skips the release.
      - name: Work out the release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**
          generate_release_notes: true
