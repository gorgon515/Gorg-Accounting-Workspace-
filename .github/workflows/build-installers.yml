name: Build ARIA installers

# Builds downloadable installers for Windows (.exe), macOS (.dmg/.zip), and
# Linux (.AppImage/.deb) on their native runners.
#
# Run it two ways:
#   • Manually: Actions tab → "Build ARIA installers" → Run workflow
#     → installers appear as downloadable artifacts on the run page.
#   • Tag a release: git tag v0.1.0 && git push origin v0.1.0
#     → installers are attached to a GitHub Release for public download.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release at this tag (e.g. v0.2.0). Leave blank to only build downloadable artifacts."
        required: false
        default: ""
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: assistant

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # No code-signing certificates: ship unsigned builds rather than fail.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: assistant/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build installers
        # macOS packaging on GitHub runners flakes intermittently (hdiutil
        # detach, app-builder exec failures). Retry the whole build a few times.
        run: |
          n=0
          until npx electron-builder --publish never; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then echo "electron-builder failed after $n attempts"; exit 1; fi
            echo "electron-builder failed; retry $n after 15s…"
            sleep 15
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aria-${{ runner.os }}
          path: |
            assistant/dist/*.exe
            assistant/dist/*.dmg
            assistant/dist/*.zip
            assistant/dist/*.AppImage
            assistant/dist/*.deb
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    # Runs on a version tag push, or on a manual run when a release_tag is given.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with installers
        uses: softprops/action-gh-release@v2
        with:
          # On a manual run, create the tag from the input; on a tag push, use it.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: artifacts/**
          generate_release_notes: true
